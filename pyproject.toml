[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="abb-alarm-copilot"
version="1.0.1"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","httpx>=0.27,<1","tenacity>=9,<10","mcp>=1.6,<2","scikit-learn>=1.5,<2","joblib>=1.4,<2"]

[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include=["alarm_api*","apps*","connectors*","mcp_servers*","rag*"]
exclude=["tests*","postman*","docs*","scripts*"]

[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]

[tool.ruff]
line-length=100
target-version="py311"

[tool.ruff.lint]
select=["E9","F"]
